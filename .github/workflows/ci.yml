name: Application checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Safe unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify locked local tools were installed
        run: node scripts/verify/installed-tools.mjs
      - run: npm run doctor
      - run: npm test

  typecheck:
    name: Full application type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify locked local tools were installed
        run: node scripts/verify/installed-tools.mjs
      - run: npm run check -- --pretty false
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify locked local tools were installed
        run: node scripts/verify/installed-tools.mjs
      - run: npm run build

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Verify locked local tools were installed
        run: node scripts/verify/installed-tools.mjs
      - run: python scripts/audit-dependencies.py --verify
      - run: npm audit --omit=dev --audit-level=high

# Database fixtures and authenticated browser flows are NOT run against the
# existing application database or faked by test auth bypasses. Configure a
# dedicated test environment before adding them as release gates.

