<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoorSurveyPro — Admin</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:40px;background:#0b1220;color:#e8f0ff}
    .card{background:#121a2b;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px;max-width:1100px}
    input{padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0f172a;color:#fff}
    button{padding:10px 14px;border-radius:10px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer}
    table{width:100%;border-collapse:collapse;margin-top:14px}
    th,td{border-bottom:1px solid rgba(255,255,255,.08);padding:8px;text-align:left;font-size:14px}
    .muted{color:#8aa0c7;font-size:12px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.3);font-size:12px}
    .tabs{display:flex;gap:8px;margin:10px 0}
    .tab{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);cursor:pointer}
    .active{background:#7c3aed}
  </style>
</head>
<body>
  <h1>DoorSurveyPro — Admin</h1>
  <div class="card">
    <div class="row">
      <input id="user" placeholder="Username" value="admin">
      <input id="pass" type="password" placeholder="Password" value="changeme">
      <button onclick="loadLocal()">Load Local Leads</button>
      <button onclick="loadHubSpot()">Load HubSpot</button>
      <span class="muted">Set env: ADMIN_USER / ADMIN_PASS; HUBSPOT_TOKEN for HubSpot.</span>
    </div>
    <div id="out" class="muted">No data yet</div>
    <table id="tbl" style="display:none">
      <thead><tr><th>Source</th><th>Name</th><th>Email</th><th>Company/Role</th><th>UTM</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    function pills(obj){
      return Object.entries(obj||{}).filter(([_,v])=>v).map(([k,v])=>`<span class="pill">${k}:${v}</span>`).join(' ');
    }
    function authHeader(){ const u=user.value, p=pass.value; return { 'Authorization':'Basic '+btoa(u+':'+p) }; }
    function render(rows){
      const tbody=document.querySelector('#tbl tbody'); tbody.innerHTML='';
      rows.forEach(x=>{
        const comp = x.company || x.role || '';
        tbody.insertAdjacentHTML('beforeend', `<tr><td>${x.source||''}</td><td>${x.name||''}</td><td>${x.email||''}</td><td>${comp}</td><td>${pills(x.utm||{})}</td></tr>`);
      });
      document.getElementById('tbl').style.display='table';
      out.textContent = rows.length + ' rows';
    }
    async function loadLocal(){
      const r = await fetch('/admin-list', { headers: authHeader() });
      if(!r.ok){ out.textContent='Auth failed'; return; }
      const j = await r.json();
      render((j.leads||[]).map(x=>({ source:x.source, name:x.name, email:x.email, company:x.company, utm:x.utm })));
    }
    async function loadHubSpot(){
      const r = await fetch('/admin-hubspot?limit=50', { headers: authHeader() });
      if(!r.ok){ out.textContent='Auth failed or HUBSPOT_TOKEN missing'; return; }
      const j = await r.json();
      render((j.rows||[]).map(x=>({ source:x.utm?.source||'hubspot', name:x.name, email:x.email, company:x.company, role:x.role, utm:x.utm })));
    }
  </script>
</body>
</html>
