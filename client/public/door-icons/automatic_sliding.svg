<svg class="door-svg" xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <style>
      .line { fill: none; stroke: var(--door-stroke); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: var(--door-stroke); stroke-width: 2; }
      .glass { fill: var(--door-glass); opacity: .35; stroke: var(--door-stroke); stroke-width: 2; }
      .grid { fill: none; stroke: var(--door-stroke); stroke-width: 1.5; opacity:.6 }
      .arrow { fill: none; stroke: var(--door-stroke); stroke-width: 2; marker-end: url(#arrow); }
      .fixed { fill: var(--door-fixed); stroke: var(--door-stroke); stroke-width: 2; }
      .operable { fill: var(--door-operable); stroke: var(--door-stroke); stroke-width: 2; }
      .badge { fill: var(--door-badge-bg); stroke: var(--door-stroke); stroke-width: 2; }
      .text { fill: var(--door-stroke); font: 700 11px Arial, sans-serif; }
      .hatch { fill: url(#diag); stroke: var(--door-stroke); stroke-width: 2; opacity:.8 }
    </style>
    <pattern id="diag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--door-stroke)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--door-stroke)"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="140" height="100" class="line" />
  <rect x="20" y="28" width="55" height="64" class="glass"/><rect x="85" y="28" width="55" height="64" class="glass"/>
  <path d="M 60 60 L 80 60" class="arrow"/><path d="M 100 60 L 80 60" class="arrow"/>
  <path d="M 55 18 q 25 -10 50 0" class="thin"/><circle cx="80" cy="15" r="5" class="thin"/>

</svg>