<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <style>
      .line { fill: none; stroke: #444; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #444; stroke-width: 2; }
      .glass { fill: #9ecff3; opacity: .35; stroke: #444; stroke-width: 2; }
      .fixed { fill: #e5e7eb; stroke: #444; stroke-width: 2; }
      .operable { fill: #bcdffb; stroke: #444; stroke-width: 2; }
      .badge { fill: #fff; stroke: #444; stroke-width: 2; }
      .text { fill: #444; font: 700 11px Arial, sans-serif; }
    </style>
  </defs>
  <rect x="10" y="10" width="140" height="100" class="line" />
<circle cx="80" cy="60" r="35" class="thin"/>
<line x1="80" y1="25" x2="80" y2="95" class="line"/>
<line x1="80" y1="60" x2="112" y2="41" class="line"/>
<line x1="80" y1="60" x2="48" y2="41" class="line"/>

</svg>