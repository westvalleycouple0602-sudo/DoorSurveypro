services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp
    ports: ["5432:5432"]
    volumes: ["dsp_pg_data:/var/lib/postgresql/data"]

  api:
    build:
      context: ./backend/express-drizzle-server
    environment:
      DATABASE_URL: postgres://dsp:dsp@db:5432/dsp
      JWT_SECRET: dev-secret
      OIDC_ISSUER: https://openid.replit.com
      OIDC_CLIENT_ID: repl-it-client
      OIDC_CLIENT_SECRET: repl-it-secret
      OIDC_REDIRECT_URI: http://localhost:3001/auth/callback
      APP_POST_LOGIN_REDIRECT: http://localhost:3000
      S3_REGION: auto
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: dsp
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    ports: ["3001:3001"]
    depends_on: ["db","minio"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000","9001:9001"]
    volumes: ["dsp_minio_data:/data"]

volumes:
  dsp_pg_data:
  dsp_minio_data:
