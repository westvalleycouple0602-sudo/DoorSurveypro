<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120">
  <defs>
    <style>
      .line { fill: none; stroke: #444; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #444; stroke-width: 2; }
      .glass { fill: #9ecff3; opacity: .35; stroke: #444; stroke-width: 2; }
      .grid { fill: none; stroke: #444; stroke-width: 1.5; opacity:.6 }
      .arrow { fill: none; stroke: #444; stroke-width: 2; marker-end: url(#arrow); }
      .fixed { fill: #e5e7eb; stroke: #444; stroke-width: 2; }
      .operable { fill: #bcdffb; stroke: #444; stroke-width: 2; }
      .badge { fill: #fff; stroke: #444; stroke-width: 2; }
      .text { fill: #444; font: 700 11px Arial, sans-serif; }
      .hatch { fill: url(#diag); stroke: #444; stroke-width: 2; opacity:.8 }
    </style>
    <pattern id="diag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="140" height="100" class="line" /><rect x="20" y="28" width="38.666666666666664" height="64" class="operable"/><line x1="29.33333333333333" y1="60" x2="49.33333333333333" y2="60" class="arrow"/><rect x="60.666666666666664" y="28" width="38.666666666666664" height="64" class="fixed"/><rect x="101.33333333333333" y="28" width="38.666666666666664" height="64" class="operable"/><line x1="110.66666666666666" y1="60" x2="130.66666666666666" y2="60" class="arrow"/>
</svg>